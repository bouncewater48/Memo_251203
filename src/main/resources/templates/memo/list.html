<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/default}">

    <section layout:fragment="contents" class="contents d-flex justify-content-center">
        <div class="contents-box my-5">
            <h2 class="text-center">메모 리스트</h2>
            <table class="table text-center mt-4">
                <thead>
                    <tr>
                        <th>No</th>
                        <th>제목</th>
                        <th>작성 날짜</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="memo:${memoList}">
                        <td th:text="${memo.id}">231</td>
                        <td th:text="${memo.title}">생플 메모 입니다</td>
                        <td th:text="${#temporals.format(memo.created_at, 'yyyy-MM-dd')}">2025-04-12</td>
                    </tr>
                </tbody>
            </table>
            <div class="d-flex justify-content-end mt-3">
                <a href="/memo/write" class="btn btn-secondary">메모 작성</a>
            </div>
        </div>
    </section>

</html>
